{% extends "index.html" %}
{% block content %}

<br>
<br>

<div class="container pt-5">
  <h3 style="margin: auto; width: 80%; text-align: center; margin-top: 20px; text-transform: uppercase">Recommendation Results</h3>
  <div style="width: 90%; margin: auto; text-align: center">

    <div class="card shadow-sm p-4 mx-auto mt-4" style="max-width: 500px; border-radius: 12px; border: 1px solid #e0e0e0;">
      <p class="text-muted mb-2">Optimal Recommendation</p>
      <h2 style="color: #2e7d32; font-weight: 700; margin: 0;">{{ result }}</h2>
    </div>

    <br>
    <br>
    <div class="prediction text-center">
      <a href="/" class="btn btn-outline-success me-2">Back to Home</a>
      <a href="javascript:history.back()" class="btn btn-success">Make Another Prediction</a>
    </div>
  </div>
</div>

<br>
<br>

{% endblock %}
